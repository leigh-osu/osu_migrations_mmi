langcode: en
status: true
id: mmi_webform
label: 'MMI webforms'
migration_group: mmi_support
dependencies:
  enforced:
    module:
      - osu_migrations_mmi
migration_tags:
  - 'Drupal 7'
  - OSU
  - MMI
  - 'MMI Support'

# Clone of webform_migrate's d7_webform over the mmi_d7_webform source,
# which keeps every derived id inside the offset namespace: the 4 MMI forms
# land as webform_<nid + 400000> (raw "webform_<nid>" ids could collide with
# the live agsci webforms). The stock migration's d7_user_role dependency is
# dropped for the same reason the agsci run dropped it: the source maps
# webform_roles rows to role machine names on its own.
source:
  plugin: mmi_d7_webform
  constants:
    settings:
      page: true
      preview: 0
      wizard_progress_bar: true
      page_submit_path: ''
      page_confirm_path: ''

process:
  id: webform_id
  uid:
    - plugin: migration_lookup
      migration: mmi_users
      source: node_uid
      no_stub: true
    - plugin: default_value
      default_value: 1
  title: title
  status: status
  elements: elements
  handlers: handlers
  access: access
  'settings/page': constants/settings/page
  'settings/page_submit_path': constants/settings/page_submit_path
  'settings/page_confirm_path': constants/settings/page_confirm_path
  'settings/wizard_progress_bar': constants/settings/wizard_progress_bar
  'settings/preview': constants/settings/preview
  'settings/draft': allow_draft
  'settings/draft_auto_save': auto_save
  'settings/confirmation_type': confirmation_type
  'settings/confirmation_url': redirect_url
  'settings/confirmation_message': confirmation
  'settings/limit_total': total_submit_limit
  'settings/limit_user': submit_limit

destination:
  plugin: 'entity:webform'

migration_dependencies:
  required:
    - mmi_users
