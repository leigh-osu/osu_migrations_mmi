langcode: en
status: true
id: mmi_media_remote_video
label: 'MMI media remote video (YouTube)'
migration_group: mmi_media
dependencies:
  enforced:
    module:
      - osu_migrations_mmi
migration_tags:
  - 'Drupal 7'
  - OSU
  - MMI
  - 'MMI Media'

# 42 youtube:// file rows. No file copy: the uri becomes an oEmbed url.
source:
  plugin: d7_file_by_type
  scheme: youtube
  type: video
  constants:
    source_base_path: '/var/www/d7'

process:
  # cas_clean_youtube_url trims youtube://v/<id>/l/<playlist> junk that
  # would otherwise 400 at YouTube's oEmbed endpoint (3 of the 42 rows).
  # One row is playlist-only (youtube://l/<id>, no video), which
  # media_remote_video passes through untouched; str_replace turns it into
  # the playlist URL, which YouTube oEmbed accepts.
  field_media_oembed_video:
    - plugin: media_remote_video
      source: uri
    - plugin: str_replace
      search: 'youtube://l/'
      replace: 'https://www.youtube.com/playlist?list='
    - plugin: cas_clean_youtube_url
  status: status
  created: timestamp
  changed: timestamp
  uid:
    - plugin: migration_lookup
      migration: mmi_users
      source: uid
      no_stub: true
    - plugin: default_value
      default_value: 1

destination:
  plugin: 'entity:media'
  default_bundle: remote_video

migration_dependencies:
  required:
    - mmi_users
