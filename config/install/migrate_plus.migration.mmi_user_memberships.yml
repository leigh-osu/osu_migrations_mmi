langcode: en
status: true
id: mmi_user_memberships
label: 'MMI user OG memberships -> group memberships'
migration_group: mmi_groups
dependencies:
  enforced:
    module:
      - osu_migrations_mmi
migration_tags:
  - 'Drupal 7'
  - OSU
  - MMI
  - 'MMI Groups'

# Actual USER memberships for the accounts that migrated (adopted or
# created); users outside the mmi_users map (unreferenced, no ONID) are
# skipped -- their profile placement above is their public presence. Held
# OG roles (group manager/author, 42 rows) collapse to the one D10 working
# role, same as the agsci run; plain members keep bare membership.
source:
  plugin: d7_og_membership_user

process:
  label: etid
  type:
    plugin: default_value
    default_value: basic_group-group_membership
  gid:
    - plugin: migration_lookup
      migration: mmi_node_og_group
      no_stub: true
      source: gid
    - plugin: skip_on_empty
      method: row
      message: 'gid is missing'
  entity_id:
    - plugin: migration_lookup
      migration: mmi_users
      no_stub: true
      source: etid
    - plugin: skip_on_empty
      method: row
      message: 'user did not migrate; profile placement only.'
  group_roles:
    - plugin: mmi_og_membership_role
      source: etid
    - plugin: skip_on_empty
      method: process

destination:
  plugin: 'entity:group_content'

migration_dependencies:
  required:
    - mmi_node_og_group
    - mmi_users
