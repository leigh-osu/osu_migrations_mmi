langcode: en
status: true
id: mmi_paragraph_1_col
label: 'MMI paragraph_1_col -> LB block'
migration_group: mmi_paragraphs
dependencies:
  enforced:
    module:
      - osu_migrations_mmi
migration_tags:
  - 'Drupal 7'
  - OSU
  - MMI
  - 'MMI Paragraphs'
source:
  plugin: osu_d7_paragraphs_item
  bundle: paragraph_1_col
process:
  type:
    plugin: default_value
    default_value: paragraph_block
  body:
    - plugin: sub_process
      source: field_p_1_col_main
      process:
        value:
          plugin: mmi_media_wysiwyg_filter
          source: value
        format:
          plugin: default_value
          default_value: full_html
  field_styles: field_p_1_col_styles
  # eb_background collections (96 image + 29 parallax across MMI) resolve
  # through the MMI media map.
  field_eb_background_fc:
    plugin: mmi_entity_background
    source: eb_background
  info:
    plugin: default_value
    default_value: 'Migrated mmi d7 paragraph paragraph_1_col'
  reusable:
    plugin: default_value
    default_value: 0
migration_dependencies:
  required:
    - mmi_files
    - mmi_media_images
