langcode: en
status: true
id: mmi_paragraph_3_col_right
label: 'MMI paragraph_3_col right column -> LB block'
migration_group: mmi_paragraphs
dependencies:
  enforced:
    module:
      - osu_migrations_mmi
migration_tags:
  - 'Drupal 7'
  - OSU
  - MMI
  - 'MMI Paragraphs'
source:
  plugin: osu_d7_paragraphs_item
  bundle: paragraph_3_col
process:
  type:
    plugin: default_value
    default_value: paragraph_block
  body:
    - plugin: sub_process
      source: field_p_3_col_right_main
      process:
        value:
          plugin: mmi_media_wysiwyg_filter
          source: value
        format:
          plugin: default_value
          default_value: full_html
  info:
    plugin: default_value
    default_value: 'Migrated mmi d7 paragraph paragraph_3_col'
  reusable:
    plugin: default_value
    default_value: 0
migration_dependencies:
  required:
    - mmi_media_images
