langcode: en
status: true
id: mmi_media_images
label: 'MMI media images'
migration_group: mmi_media
dependencies:
  enforced:
    module:
      - osu_migrations_mmi
migration_tags:
  - 'Drupal 7'
  - OSU
  - MMI
  - 'MMI Media'

source:
  plugin: d7_file_by_type
  scheme: public
  type: image
  get_alt: true
  get_title: true
  constants:
    source_base_path: '/var/www/d7'

process:
  field_media_image/target_id:
    - plugin: migration_lookup
      migration: mmi_files
      source: fid
      no_stub: true
    - plugin: skip_on_empty
      method: row
  thumbnail/target_id:
    - plugin: migration_lookup
      migration: mmi_files
      source: fid
      no_stub: true
  field_media_image/alt: alt
  field_media_image/title: title
  status: status
  created: timestamp
  changed: timestamp
  uid:
    - plugin: migration_lookup
      migration: mmi_users
      source: uid
      no_stub: true
    - plugin: default_value
      default_value: 1

destination:
  plugin: 'entity:media'
  default_bundle: image

migration_dependencies:
  required:
    - mmi_files
    - mmi_users
