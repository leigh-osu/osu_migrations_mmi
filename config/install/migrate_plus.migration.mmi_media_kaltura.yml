langcode: en
status: true
id: mmi_media_kaltura
label: 'MMI media Kaltura (MediaSpace)'
migration_group: mmi_media
dependencies:
  enforced:
    module:
      - osu_migrations_mmi
migration_tags:
  - 'Drupal 7'
  - OSU
  - MMI
  - 'MMI Media'

# 3 mediaspace:// (media.oregonstate.edu) rows.
source:
  plugin: d7_file_by_type
  scheme: mediaspace
  type: video
  constants:
    source_base_path: '/var/www/d7'

process:
  field_media_oembed_video:
    - plugin: media_remote_video
      source: uri
  status: status
  created: timestamp
  changed: timestamp
  uid:
    - plugin: migration_lookup
      migration: mmi_users
      source: uid
      no_stub: true
    - plugin: default_value
      default_value: 1

destination:
  plugin: 'entity:media'
  default_bundle: kaltura

migration_dependencies:
  required:
    - mmi_users
