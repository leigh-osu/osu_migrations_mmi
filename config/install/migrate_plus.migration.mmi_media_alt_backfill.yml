langcode: en
status: true
id: mmi_media_alt_backfill
label: 'MMI: backfill media image alt/title from D7 per-delta field text'
# `default` group, not an mmi_* one, mirroring cas_media_alt_backfill: the
# grouped node process defaults would corrupt a media update, and the runner's
# group rollback sweeps must never roll this back (rollback would delete the
# media entities themselves, not just the backfilled text).
migration_group: default
dependencies:
  enforced:
    module:
      - osu_migrations_mmi
migration_tags:
  - 'Drupal 7'
  - OSU
  - MMI

source:
  plugin: mmi_media_alt_backfill

process:
  # The source only yields media that need a change; it emits the complete
  # desired image value, so target_id must be written back to preserve the file.
  mid: mid
  field_media_image/target_id: target_id
  field_media_image/alt: alt
  field_media_image/title: title

destination:
  plugin: 'entity:media'
  default_bundle: image

migration_dependencies:
  required:
    - mmi_media_images
