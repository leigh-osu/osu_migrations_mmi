langcode: en
status: true
id: mmi_user_authmap
label: 'MMI CAS login mappings (uid -> authmap, provider cas)'
migration_group: mmi_accounts
dependencies:
  enforced:
    module:
      - osu_migrations_mmi
migration_tags:
  - 'Drupal 7'
  - OSU
  - MMI
  - 'MMI Accounts'
source:
  # Gates on the mmi cas_user table (83 rows), not the source module flag.
  plugin: osu_cas_user
process:
  uid:
    - plugin: migration_lookup
      migration: mmi_users
      no_stub: true
      source: uid
    - plugin: skip_on_empty
      method: row
      message: 'No migrated user for this uid; skipping CAS mapping.'
    # Adopted accounts already have their live authmap row; recording them in
    # this migration's map would let a rollback delete a mapping it never
    # created.
    - plugin: mmi_skip_existing_authmap
  provider:
    - plugin: default_value
      default_value: cas
  authname: cas_name
destination:
  plugin: authmap
migration_dependencies:
  required:
    - mmi_users
