langcode: en
status: true
id: mmi_redirect
label: 'MMI path redirects'
migration_group: mmi_support
dependencies:
  enforced:
    module:
      - osu_migrations_mmi
migration_tags:
  - 'Drupal 7'
  - OSU
  - MMI
  - 'MMI Support'

# 1,286 D7 redirects. Targets rewrite through mmi_redirect_target (node
# offset, user -> profile node, file -> the migrated file's real URL);
# cas_redirect_hash_dedupe skips any source that collides on redirect.hash
# with a live redirect (agsci's or an earlier MMI row) instead of failing
# the insert. rids are not preserved. The internal:// str_replace repairs
# core's double-slash on leading-slash D7 targets (same fix the agsci run
# applied via its alter).
source:
  plugin: d7_path_redirect

process:
  uid:
    - plugin: migration_lookup
      migration: mmi_users
      source: uid
      no_stub: true
    - plugin: default_value
      default_value: 1
  redirect_source/path:
    - plugin: cas_redirect_hash_dedupe
      source: source
  redirect_source/query:
    plugin: d7_redirect_source_query
    source: source_options
  redirect_redirect/uri:
    - plugin: d7_path_redirect
      source:
        - redirect
        - redirect_options
    - plugin: str_replace
      search: 'internal://'
      replace: 'internal:/'
    - plugin: mmi_redirect_target
  language:
    plugin: default_value
    source: language
    default_value: und
  enabled: status
  status_code: status_code

destination:
  plugin: 'entity:redirect'

migration_dependencies:
  required:
    - mmi_users
    - mmi_files
    - mmi_profiles
