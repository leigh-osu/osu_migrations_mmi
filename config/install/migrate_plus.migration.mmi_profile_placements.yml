langcode: en
status: true
id: mmi_profile_placements
label: 'MMI user OG memberships -> profile-node Group content'
migration_group: mmi_groups
dependencies:
  enforced:
    module:
      - osu_migrations_mmi
migration_tags:
  - 'Drupal 7'
  - OSU
  - MMI
  - 'MMI Groups'

# One profile-in-group relationship per D7 user og_membership (97 rows) --
# the association the profiles_group_membership view lists. The person's
# functional_group term (79 of 104 people) lands on field_membership_type
# through the mmi_membership_terms map; people without one join the untyped
# associations the membership-type backfill tracks (keep that field
# optional until they are cleared).
source:
  plugin: d7_og_membership_user

process:
  label: etid
  type:
    plugin: cas_group_relationship_type_id
    group_type: basic_group
    relation_plugin: 'group_node:osu_profile'
  gid:
    - plugin: migration_lookup
      migration: mmi_node_og_group
      no_stub: true
      source: gid
    - plugin: skip_on_empty
      method: row
      message: 'gid is missing'
  entity_id:
    - plugin: migration_lookup
      migration: mmi_profiles
      no_stub: true
      source: etid
    - plugin: skip_on_empty
      method: row
      message: 'profile node missing.'
  field_membership_type:
    - plugin: mmi_membership_type
      source: etid
    - plugin: skip_on_empty
      method: process

destination:
  plugin: 'entity:group_content'

migration_dependencies:
  required:
    - mmi_node_og_group
    - mmi_profiles
    - mmi_membership_terms
