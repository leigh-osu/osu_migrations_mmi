langcode: en
status: true
id: mmi_media_local_video
label: 'MMI media local video'
migration_group: mmi_media
dependencies:
  enforced:
    module:
      - osu_migrations_mmi
migration_tags:
  - 'Drupal 7'
  - OSU
  - MMI
  - 'MMI Media'

# 19 video files uploaded to the D7 public filesystem.
source:
  plugin: d7_file_by_type
  scheme: public
  type: video
  constants:
    source_base_path: '/var/www/d7'

process:
  field_media_file/target_id:
    - plugin: migration_lookup
      migration: mmi_files
      source: fid
      no_stub: true
    - plugin: skip_on_empty
      method: row
  field_media_file/display:
    plugin: default_value
    default_value: 1
  status: status
  created: timestamp
  changed: timestamp
  uid:
    - plugin: migration_lookup
      migration: mmi_users
      source: uid
      no_stub: true
    - plugin: default_value
      default_value: 1

destination:
  plugin: 'entity:media'
  default_bundle: local_video

migration_dependencies:
  required:
    - mmi_files
    - mmi_users
